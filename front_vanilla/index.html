<!DOCTYPE html>
    <html lang="es">
    <head>
        <!-- Metadatos y recursos del documento -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Wikinguin</title>
        <meta
            name="description"
            content="Recursos y enlaces para aprender y descubrir nuevos conocimientos."
        >

        <link rel="stylesheet" href="css/styles.css">
        <link rel="icon" type="image/webp" href="assets/logo.webp">
    </head>

    <body>
        <!-- Encabezado y navegación principal -->
        <header>
            <nav aria-label="Navegación principal">
                <a href="index.html" class="brand">
                    <img
                        src="assets/logo.webp"
                        alt=""
                        width="40"
                        height="40"
                    >
                    <span>Wikinguin</span>
                </a>
            </nav>
        </header>

        <main>
            <!-- Vista principal con el listado de recursos -->
            <section id="links-view" aria-labelledby="links-title">
                <h1 id="links-title">Recursos para Pinguinos del Saber</h1>
                <p>Revisa nuestro Directorio para ampliar tus conocimientos.</p>

                <!-- Control para filtrar los links por una etiqueta -->
                <form id="filter-form">
                    <label for="tag-filter">Filtrar por etiqueta</label>
                    <input
                        id="tag-filter"
                        name="tag"
                        type="search"
                        placeholder="Ej. javascript"
                    >
                    <button type="submit">Filtrar</button>
                </form>

                <!-- Formulario para guardar un nuevo recurso -->
                <section aria-labelledby="create-title">
                    <h2 id="create-title">Guardar un nuevo recurso</h2>
                    <form id="create-link-form">
                        <label for="link-title">Título</label>
                        <input
                            id="link-title"
                            name="title"
                            type="text"
                            placeholder="Ej. MDN Web Docs"
                            required
                        >

                        <label for="link-url">URL</label>
                        <input
                            id="link-url"
                            name="url"
                            type="url"
                            placeholder="https://..."
                            required
                        >

                        <label for="link-description">Descripción</label>
                        <textarea
                            id="link-description"
                            name="description"
                            placeholder="Breve descripción del recurso"
                        ></textarea>

                        <label for="link-tags">Etiquetas </label>
                        <input
                            id="link-tags"
                            name="tags"
                            type="text"
                            placeholder="javascript, css, recursos"
                        >

                        <button type="submit">Guardar link</button>
                        <p id="create-link-message" aria-live="polite"></p>
                    </form>
                </section>

                <!-- Los recursos se generan dinámicamente con JavaScript -->
                <div
                    id="links-list"
                    aria-live="polite"
                    aria-busy="true"
                ></div>
            </section>

            <!-- Vista de detalle, oculta hasta seleccionar un recurso -->
            <section
                id="link-detail"
                aria-labelledby="link-detail-title"
                hidden
            >
                <button id="back-button" type="button">
                    ← Volver
                </button>

                <h2 id="link-detail-title">Detalle del recurso</h2>

                <!-- Contenido generado dinámicamente con JavaScript -->
                <div id="link-detail-content"></div>
            </section>
        </main>

        <!-- Peticiones a la API y lógica de la aplicación -->
        <script src="js/api.js" defer></script>
        <script src="js/app.js" defer></script>
    </body>
    </html>
